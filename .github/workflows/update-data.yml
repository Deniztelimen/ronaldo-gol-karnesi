name: Gol/asist verisini güncelle

on:
  schedule:
    # Her gün 06:00 UTC (09:00 Türkiye saati)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Veriyi çek ve tüm sayfaları yeniden üret
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: node scripts/update-data.mjs

      - name: Değişiklik varsa commit'le ve push'la
        run: |
          git config user.name "ronaldo-gol-karnesi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json sitemap.xml og-image.png index.html en de zh ru fr it pt widget
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: otomatik gol/asist güncellemesi"
            git push
          fi
